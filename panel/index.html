<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ui-foreground: var(--lobby-foreground, var(--orca-foreground));
        --ui-background: var(--lobby-background, var(--orca-background));
        --ui-muted-foreground: var(--lobby-muted, var(--orca-muted-foreground));
        --ui-border: var(--lobby-border, var(--orca-border));
        --ui-card: var(--lobby-card, var(--orca-card));
        --ui-primary: var(--lobby-accent, var(--orca-primary));
        --ui-ring: var(--lobby-accent, var(--orca-ring, var(--ui-primary)));
        --ui-popover: var(--lobby-card, var(--orca-popover, var(--ui-card)));
        --ui-popover-foreground: var(--lobby-foreground, var(--orca-popover-foreground, var(--ui-foreground)));
        --working: #30a46c;
        --blocked: #ed823b;
        --failed: #e5484d;
        --unread: #3987e5;
        --waiting: #e2a336;
        --done: #8b8fa3;
        --radius: var(--orca-radius, 8px);
        --agent-surface: var(--ui-card);
        --detail-surface: color-mix(in srgb, var(--ui-foreground) 5%, var(--ui-card));
        --control-secondary: var(--ui-muted-foreground);
        --tab-active: var(--ui-primary);
      }
      :root:not([data-palette]),
      :root[data-palette='orca'] {
        --agent-surface: #f3f5f8;
        --detail-surface: #f3f5f8;
      }
      :root.dark:not([data-palette]),
      :root.dark[data-palette='orca'] {
        --agent-surface: #303d50;
        --detail-surface: #394a60;
      }
      html {
        scrollbar-width: none;
      }
      html::-webkit-scrollbar {
        display: none;
      }
      body {
        margin: 0;
        padding: 12px 16px;
        font: 12px/1.35 system-ui, sans-serif;
        color: var(--ui-foreground);
        background: var(--ui-background);
      }
      body:not(.prefs-ready) { visibility: hidden; }
      #prefs-status:empty { display: none; }
      #prefs-status { margin: 0 0 6px; color: var(--ui-muted-foreground); }
      #banner {
        margin-bottom: 8px;
        border-radius: var(--radius);
      }
      #primary-tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 8px;
        overflow-x: auto;
        border-bottom: 1px solid var(--ui-border);
        scrollbar-width: none;
      }
      #view-filters:not([hidden]) { margin: 0 0 8px; }
      .filter-toolbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
      #filter-disclosure { flex: 0 0 auto; min-width: 0; }
      #filter-summary { display: flex; align-items: center; gap: 6px; min-height: 32px; cursor: pointer; }
      #filter-indicator { display: inline-block; width: 10px; text-align: center; }
      #filter-summary:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }
      #filter-active-count { color: var(--ui-muted-foreground); font-size: 11px; }
      #filter-controls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin-top: 4px; }
      #view-filters input, #view-filters select { width: 100%; min-width: 0; min-height: 34px; padding: 4px 8px; color: var(--ui-foreground); background: var(--ui-card); border: 1px solid var(--ui-border); border-radius: var(--radius); font: inherit; }
      #filter-count { margin-left: auto; color: var(--ui-muted-foreground); white-space: nowrap; }
      #clear-filters { flex: 0 0 auto; min-height: 32px; }
      #attention-list { display: grid; gap: 8px; }
      .attention-heading { margin: 4px 0; font-size: 18px; }
      .attention-group h2 { margin: 8px 0 4px; font-size: 13px; }
      .attention-finished > summary { min-height: 32px; margin: 8px 0 4px; padding: 6px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
      .attention-finished > summary:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }
      .attention-finished-rows { min-width: 0; }
      .attention-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; min-width: 0; padding: 5px 0 5px 8px; border-bottom: 1px solid var(--ui-border); border-left: 3px solid var(--ui-border); }
      .attention-row.attention-needs-input { border-left-color: var(--blocked); }
      .attention-row.attention-failed { border-left-color: var(--failed); }
      .attention-row.attention-finished { border-left-color: var(--unread); }
      .attention-title { grid-column: 1; min-width: 0; width: 100%; min-height: 32px; padding: 0; border: 0; border-radius: 0; background: transparent; color: var(--ui-foreground); text-align: left; font: inherit; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
      .attention-meta { grid-column: 1; min-width: 0; margin: 0; color: var(--ui-muted-foreground); font-size: 12px; overflow-wrap: anywhere; }
      .attention-time { color: inherit; }
      .attention-actions { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 2px; min-width: 0; max-width: 10em; }
      .attention-actions .action { min-height: 32px; max-width: 100%; padding: 5px 8px; white-space: normal; }
      .attention-unavailable { max-width: 100%; color: var(--ui-muted-foreground); font-size: 10px; line-height: 1.2; text-align: right; overflow-wrap: anywhere; }
      .attention-feedback { grid-column: 1 / -1; margin: 0; color: var(--ui-muted-foreground); font-size: 12px; overflow-wrap: anywhere; }
      .attention-empty { padding: 14px; border: 1px dashed var(--ui-border); border-radius: var(--radius); }
      :root.compact .attention-row { padding-top: 3px; padding-bottom: 3px; }
      :root.compact .attention-group h2 { margin: 6px 0 3px; }
      :root.compact .roster .agent { padding-top: 3px; padding-bottom: 3px; }
      :root.compact #activity-list { gap: 4px; }
      #banner[hidden] { display: none; }
      .primary-tab {
        flex: 0 0 auto;
        min-height: 36px;
        padding: 8px 10px;
        font: inherit;
        color: var(--ui-muted-foreground);
        background: transparent;
        border: 0;
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }
      .primary-tab[aria-selected='true'] {
        color: var(--ui-foreground);
        border-bottom-color: var(--ui-primary);
        font-weight: 600;
      }
      .primary-tab:focus-visible,
      .activity-toggle:focus-visible,
      .action:focus-visible,
      .attention-title:focus-visible,
      #view-filters input:focus-visible,
      #view-filters select:focus-visible {
        outline: 2px solid var(--ui-primary);
        outline-offset: 2px;
      }
      .page[hidden] {
        display: none;
      }
      #activity-list {
        display: grid;
        gap: 8px;
        min-width: 0;
      }
      .activity-agent {
        min-width: 0;
        overflow: hidden;
        background: var(--ui-card);
        border: 1px solid var(--ui-border);
        border-radius: var(--radius);
      }
      .activity-heading {
        margin: 0;
        font-size: inherit;
        font-weight: 400;
      }
      .activity-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-width: 0;
        padding: 8px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .activity-agent-summary {
        display: grid;
        flex: 1;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        align-items: center;
        gap: 3px 8px;
        min-width: 0;
      }
      .activity-face {
        grid-row: 1 / 4;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ui-foreground) 9%, transparent);
      }
      .activity-agent-name {
        grid-column: 2;
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        font-weight: 600;
      }
      .activity-agent-name > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .activity-agent-doing {
        grid-column: 2 / -1;
        min-width: 0;
        overflow: hidden;
        color: var(--ui-muted-foreground);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .activity-agent-time {
        grid-column: 2 / -1;
        min-width: 0;
        overflow: hidden;
        color: var(--ui-muted-foreground);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .activity-status {
        --status-color: var(--ui-muted-foreground);
        display: inline-flex;
        justify-self: end;
        align-items: center;
        min-height: 18px;
        padding: 0 6px;
        border: 1px solid color-mix(in srgb, var(--status-color) 48%, var(--ui-border));
        border-radius: 999px;
        background: color-mix(in srgb, var(--status-color) 14%, var(--ui-card));
        color: var(--ui-foreground);
        font-size: 10px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
      }
      .activity-status.status-working {
        --status-color: var(--working);
      }
      .activity-status.status-blocked { --status-color: var(--blocked); }
      .activity-status.status-failed { --status-color: var(--failed); }
      .activity-status.status-waiting {
        --status-color: var(--waiting);
      }
      .activity-status.status-done {
        --status-color: var(--done);
      }
      .activity-status.status-unread {
        --status-color: var(--unread);
      }
      .activity-chevron {
        flex: none;
        width: 20px;
        text-align: center;
        color: var(--ui-muted-foreground);
      }
      .activity-agent-body {
        border-top: 1px solid var(--ui-border);
      }
      .family-tree {
        min-width: 0;
        padding: 8px;
        overflow: hidden;
        background: var(--detail-surface);
        border: 1px solid var(--ui-border);
        border-radius: var(--radius);
      }
      .family-title {
        margin: 0 0 2px;
        font-size: 12px;
        font-weight: 650;
      }
      .family-note {
        margin: 0 0 7px;
        color: var(--ui-muted-foreground);
        font-size: 10px;
      }
      .family-roots,
      .family-children {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .family-node {
        min-width: 0;
      }
      .family-node + .family-node {
        border-top: 1px solid var(--ui-border);
      }
      .family-node-row {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }
      .family-agent-link,
      .family-child-toggle {
        display: grid;
        flex: 1;
        grid-template-columns: 24px minmax(0, 1fr);
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 4px 2px;
        color: inherit;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .family-agent-link:focus-visible,
      .family-child-toggle:focus-visible,
      .family-branch-toggle:focus-visible,
      .family-detail-toggle:focus-visible {
        outline: 2px solid var(--ui-primary);
        outline-offset: 1px;
      }
      .family-agent-link:hover,
      .family-child-toggle:hover {
        background: color-mix(in srgb, var(--ui-foreground) 5%, transparent);
      }
      .family-identity {
        display: grid;
        min-width: 0;
      }
      .family-name,
      .family-work {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .family-name {
        font-weight: 600;
      }
      .family-work {
        color: var(--ui-muted-foreground);
        font-size: 10px;
      }
      .family-placeholder {
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        color: var(--ui-muted-foreground);
        background: color-mix(in srgb, var(--ui-foreground) 8%, transparent);
        border-radius: 6px;
      }
      .family-status {
        flex: none;
        max-width: 42%;
        overflow: hidden;
        padding: 1px 5px;
        color: var(--ui-muted-foreground);
        border: 1px solid var(--ui-border);
        border-radius: 999px;
        font-size: 9px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .family-status.status-working { color: var(--working); }
      .family-status.status-blocked { color: var(--blocked); }
      .family-status.status-waiting { color: var(--waiting); }
      .family-status.status-done { color: var(--done); }
      .family-status.status-failed { color: var(--failed); }
      .family-status.status-unread { color: var(--unread); }
      .family-branch-toggle,
      .family-detail-toggle {
        flex: none;
        min-width: 24px;
        min-height: 24px;
        padding: 2px 5px;
        color: var(--ui-muted-foreground);
        background: transparent;
        border: 1px solid var(--ui-border);
        border-radius: 5px;
        cursor: pointer;
      }
      .family-branch-spacer {
        flex: none;
        width: 24px;
      }
      .family-children {
        margin-left: 12px;
        padding-left: 8px;
        border-left: 1px solid var(--ui-border);
      }
      .family-relationship,
      .family-child-detail {
        margin: 0 0 4px 33px;
        overflow-wrap: anywhere;
        color: var(--ui-muted-foreground);
        font-size: 10px;
      }
      .family-child-detail {
        padding: 4px 6px;
        background: color-mix(in srgb, var(--ui-foreground) 4%, transparent);
        border-radius: 5px;
      }
      .family-child-detail p {
        margin: 2px 0;
      }
      .agent-identity {
        margin: 4px 0 8px;
        overflow-wrap: anywhere;
        color: var(--ui-muted-foreground);
      }
      .choice {
        display: flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
        cursor: pointer;
      }
      .choice input {
        margin: 0;
        accent-color: var(--ui-primary);
      }
      .notification-controls, .appearance-settings { display: grid; gap: 6px; min-width: 0; }
      .notification-controls > h2, .appearance-heading > h2 { margin: 4px 0 2px; font-size: 14px; }
      .notification-controls .choice { white-space: normal; min-height: 24px; }
      .notification-controls .palette-setting { padding: 6px 0; }
      .notification-note, .notification-project-status, .notification-agent-status, .notification-error { margin: 2px 0; color: var(--ui-muted-foreground); overflow-wrap: anywhere; }
      .notification-group { margin-top: 8px; }
      .notification-group > h3 { margin: 0 0 3px; font-size: 12px; }
      .notification-row { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 10px; padding: 5px 0; border-top: 1px solid var(--ui-border); }
      .notification-detail { flex: 1 1 135px; min-width: 0; }
      .notification-title { margin: 0; overflow-wrap: anywhere; font-size: 12px; }
      .notification-error { color: var(--ui-warning, var(--ui-muted-foreground)); }
      .notification-actions { display: flex; flex-wrap: wrap; gap: 4px; max-width: 100%; }
      .notification-actions:empty { display: none; }
      .notification-controls .notification-actions .action { min-height: 36px; max-width: 100%; white-space: normal; }
      .appearance-settings { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--ui-border); }
      .appearance-heading { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      #brand-toggle { min-height: 36px; }
      .palette-setting {
        display: grid;
        gap: 7px;
        padding: 10px 0;
        border-bottom: 1px solid var(--ui-border);
      }
      .palette-select {
        width: 100%;
        min-height: 34px;
        padding: 5px 8px;
        color: var(--ui-foreground);
        background: var(--ui-card);
        border: 1px solid var(--ui-border);
        border-radius: var(--radius);
        font: inherit;
      }
      .palette-select:focus-visible {
        outline: 2px solid var(--ui-primary);
        outline-offset: 2px;
      }
      .palette-preview {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 5px 8px;
        border: 1px solid var(--ui-border);
        border-radius: var(--radius);
        font-size: 11px;
      }
      .palette-swatch {
        width: 15px;
        height: 15px;
        border: 1px solid currentColor;
        border-radius: 50%;
      }
      .roster li.folded {
        background: none;
      }
      .fold {
        width: 100%;
        padding: 5px 8px;
        font: inherit;
        font-size: 11px;
        color: var(--ui-muted-foreground);
        text-align: left;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .fold:hover {
        color: var(--ui-foreground);
      }
      .action.more {
        margin-top: 4px;
      }
      .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--waiting);
      }
      .working .dot:not([style]) {
        background: var(--working);
      }
      .blocked .dot:not([style]) {
        background: var(--blocked);
      }
      .done .dot:not([style]) {
        background: var(--done);
      }
      /* A room and its agents are one box: the picture on top, the list under it. */
      .office {
        position: relative;
        overflow: hidden;
        background: var(--ui-card);
        border: 1px solid var(--ui-border);
        border-radius: var(--radius);
      }
      /* Two stacked columns (one in List): folding a project slides up only those beneath it. */
      .columns { display: grid; gap: 10px; align-items: start; min-width: 0; }
      :root.grid .columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .column { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .column:empty { display: none; }
      /* List / Grid: two projects per line once the panel is wide enough (GRID_MIN_WIDTH in main.ts). */
      .layout-toggle { display: flex; gap: 2px; margin-left: auto; }
      .page-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .agent-counts { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 11px; color: var(--ui-muted-foreground); }
      .chart-filter .agent-counts { margin-left: auto; }
      .chart-filter .agent-counts + .layout-toggle { margin-left: 4px; }
      .agent-count { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
      .agent-count .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
      .agent-count.status-working .dot { color: var(--working); }
      .agent-count.status-blocked { color: var(--blocked); font-weight: 600; }
      .agent-count.status-done .dot { color: var(--done); }
      .agent-count.status-failed .dot { color: var(--failed); }
      .layout-toggle .action { min-height: 28px; }
      .layout-toggle .action[aria-pressed='true'] { color: var(--ui-foreground); border-color: var(--ui-primary); background: color-mix(in srgb, var(--ui-primary) 14%, var(--ui-card)); }
      .office:has(.roster li.blocked) {
        border-color: color-mix(in srgb, var(--blocked) 55%, var(--ui-border));
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      .roster {
        margin: 0;
        padding: 0;
        list-style: none;
        border-top: 1px solid var(--ui-border);
      }
      .roster:empty {
        display: none;
      }
      .roster li {
        --row-bg: var(--agent-surface);
        overflow: hidden;
        background: var(--row-bg);
        box-shadow: inset 3px 0 0 transparent;
        transition: box-shadow 0.15s;
      }
      .roster li + li {
        border-top: 1px solid var(--ui-border);
      }
      .roster li.blocked {
        --row-bg: color-mix(in srgb, var(--blocked) 12%, var(--agent-surface));
        box-shadow: inset 3px 0 0 var(--blocked);
      }
      .roster li.selected:not(.blocked) {
        --row-bg: var(--detail-surface);
      }
      .agent {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr) auto;
        gap: 0 8px;
        align-items: center;
        width: 100%;
        padding: 5px 8px;
        font: inherit;
        color: inherit;
        text-align: left;
        background: none;
        border: 0;
        cursor: pointer;
      }
      .agent:hover {
        background: color-mix(in srgb, var(--ui-foreground) 5%, transparent);
      }
      .agent:focus-visible {
        outline: 2px solid var(--ui-ring);
        outline-offset: -2px;
        border-radius: var(--radius);
      }
      .face {
        grid-row: 1 / 3;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--ui-foreground) 9%, transparent);
      }
      .name,
      .doing span,
      .detail {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .name {
        font-weight: 600;
      }
      .name > .model-kind {
        margin-left: 4px;
      }
      .title {
        margin-left: 6px;
        font-weight: 400;
        color: var(--ui-muted-foreground);
      }
      .state {
        --status-color: var(--done);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 9px 2px 7px;
        border: 1px solid color-mix(in srgb, var(--status-color) 48%, var(--ui-border));
        border-radius: 999px;
        background: color-mix(in srgb, var(--status-color) 14%, var(--ui-card));
        color: var(--ui-foreground);
        font-size: 11px;
      }
      .state.status-working { --status-color: var(--working); }
      .state.status-waiting { --status-color: var(--waiting); }
      .state.status-blocked { --status-color: var(--blocked); }
      .state.status-failed { --status-color: var(--failed); }
      .state.status-unread { --status-color: var(--unread); }
      .state .dot:not([style]) { background: var(--status-color); }
      .doing {
        display: flex;
        grid-column: 2 / 4;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--ui-muted-foreground);
        font-variant-numeric: tabular-nums;
      }
      .action {
        padding: 3px 9px;
        font: inherit;
        font-size: 11px;
        color: var(--ui-foreground);
        background: color-mix(in srgb, var(--ui-foreground) 7%, transparent);
        border: 1px solid var(--ui-border);
        border-radius: 6px;
        cursor: pointer;
      }
      .action:hover {
        background: color-mix(in srgb, var(--ui-foreground) 13%, transparent);
      }

      .chart-node { position: absolute; width: 112px; height: 90px; border: 1px solid var(--ui-border); border-radius: 8px; background: var(--agent-surface); box-shadow: 0 2px 5px #0002; }
      .chart-node.selected { border-color: var(--ui-primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--ui-primary) 32%, transparent); }
      .chart-node-button { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; grid-template-rows: 31px 18px 1fr; gap: 1px 5px; width: 100%; height: 100%; min-width: 0; padding: 6px; font: inherit; color: var(--ui-foreground); text-align: left; background: transparent; border: 0; border-radius: 7px; cursor: pointer; }
      .chart-unknown { cursor: default; }
      .chart-face, .chart-placeholder { width: 28px; height: 28px; grid-row: 1; border-radius: 6px; background: color-mix(in srgb, var(--ui-foreground) 9%, transparent); }
      .chart-placeholder { display: grid; place-items: center; }
      .chart-identity { display: grid; min-width: 0; align-content: center; }
      .chart-name, .chart-provider { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chart-provider { color: var(--ui-muted-foreground); font-size: 10px; }
      .chart-status { grid-column: 2 / 4; align-self: center; justify-self: start; font-size: 10px; font-weight: 650; color: var(--ui-foreground); }
      .chart-status::before { content: '●'; margin-right: 4px; color: var(--done); }
      .chart-status.status-working::before { color: var(--working); }
      .chart-status.status-blocked::before { color: var(--blocked); }
      .chart-status.status-waiting::before { color: var(--waiting); }
      .chart-status.status-failed::before { color: var(--failed); }
      .chart-new { font-size: 9px; color: var(--unread); grid-column: 3; grid-row: 1; }
      .chart-task { grid-column: 1 / 4; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; color: var(--ui-muted-foreground); font-size: 10px; line-height: 1.25; }
      .chart-branch { position: absolute; z-index: 1; right: -7px; bottom: -11px; min-width: 24px; min-height: 24px; padding: 0; border-radius: 50%; background: var(--ui-card); }
      /* The agent drawer: a bottom sheet over the whole panel, as in the OpenRouter plugin. */
      .scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .45); animation: fade-in .2s ease; }
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 85vh; display: flex; flex-direction: column; background: var(--ui-card); color: var(--ui-foreground); border: 1px solid var(--ui-border); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .3); animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1); }
      .scrim.still, .sheet.still { animation: none; }
      .sheet-grab { flex: none; width: 40px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--ui-border); }
      .sheet-body { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 720px; margin: 0 auto; padding: 12px 16px 20px; box-sizing: border-box; }
      :root.drawer-open { overflow: hidden; }
      .drawer-head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
      .drawer-face { flex: none; width: 36px; height: 36px; image-rendering: pixelated; border-radius: 8px; }
      .drawer-titles { flex: 1; min-width: 0; }
      .drawer-titles h2 { margin: 0; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
      .drawer-sub { margin: 2px 0 0; color: var(--ui-muted-foreground); }
      .drawer-close { flex: none; min-width: 32px; min-height: 32px; font-size: 16px; }
      .drawer-status { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
      .drawer-line { margin: 0; color: var(--ui-muted-foreground); overflow-wrap: anywhere; }
      .drawer-review { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0; }
      .drawer-review .action { min-height: 32px; }
      .drawer-review-status, .drawer-review-error { margin: 0; overflow-wrap: anywhere; }
      .drawer-review-status { color: var(--ui-muted-foreground); }
      .drawer-review-error { color: var(--ui-warning, var(--ui-muted-foreground)); }
      .drawer-extra { padding: 8px 10px; border: 1px solid var(--ui-border); border-radius: var(--radius); }
      .drawer-extra > summary { min-height: 28px; color: var(--ui-primary); font-weight: 650; cursor: pointer; }
      .drawer-extra > summary:focus-visible { outline: 2px solid var(--ui-primary); outline-offset: 2px; }
      .drawer-extra[open] > summary { margin-bottom: 8px; }
      .sheet .details { padding: 0; background: none; }
      .drawer-part { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .drawer-part:empty { display: none; }
      .sheet .tabbox { margin: 4px 0 0; }
      @keyframes fade-in { from { opacity: 0; } }
      @keyframes sheet-up { from { transform: translateY(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .scrim, .sheet { animation: none; }
        .tab.grew {
          animation: none;
        }
        .note {
          transform: none;
        }
      }
      .call {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 7px;
        align-items: center;
        padding: 3px 0;
        color: var(--ui-muted-foreground);
      }
      .call.running {
        color: var(--ui-foreground);
      }
      .call.running .when::before {
        content: 'running ';
      }
      .tool {
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ui-foreground);
      }
      .said {
        display: -webkit-box;
        margin: 0 0 6px;
        overflow: hidden;
        color: var(--ui-muted-foreground);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }
      .said b {
        margin-right: 6px;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .now {
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .when {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      #office-message:empty { display: none; }
      .quiet {
        margin: 0;
        color: var(--ui-muted-foreground);
      }
      @media (max-width: 400px) {
      }
      @media (prefers-reduced-motion: reduce) {
        .roster li {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="banner" role="img" aria-label="The Lobby"></canvas>
    <nav id="primary-tabs" role="tablist" aria-label="The Lobby sections">
      <button class="primary-tab" id="office-tab" role="tab" aria-controls="office-page" aria-selected="true">Office</button>
      <button class="primary-tab" id="activity-tab" role="tab" aria-controls="activity-page" aria-selected="false">Activity</button>
      <button class="primary-tab" id="attention-tab" role="tab" aria-controls="attention-page" aria-selected="false">Attention</button>
      <button class="primary-tab" id="settings-tab" role="tab" aria-controls="settings-page" aria-selected="false">Settings</button>
    </nav>
    <p id="prefs-status" class="quiet" role="status" aria-live="polite">Restoring your Lobby view…</p>
    <div id="view-filters">
      <div class="filter-toolbar">
        <details id="filter-disclosure">
          <summary id="filter-summary" data-focus-key="shared-filter-summary"><span id="filter-indicator" aria-hidden="true">▸</span> Filter <span id="filter-active-count"></span></summary>
          <div id="filter-controls" role="search"></div>
        </details>
        <span id="filter-count" aria-live="off"></span>
        <button id="clear-filters" class="action" type="button" aria-label="Clear filters" hidden>Clear</button>
      </div>
    </div>
    <main id="office-page" class="page" role="tabpanel" aria-labelledby="office-tab">
      <p id="office-message" class="quiet" role="status"></p>
      <div id="offices" class="columns"></div>
      <p id="today"></p>
    </main>
    <main id="activity-page" class="page" role="tabpanel" aria-labelledby="activity-tab" hidden>
      <div id="activity-list" aria-label="Agent activity"></div>
    </main>
    <main id="attention-page" class="page" role="tabpanel" aria-labelledby="attention-tab" hidden>
      <p id="attention-feedback" class="quiet" role="status" aria-live="polite"></p>
      <div id="attention-list" aria-label="Attention queue"></div>
    </main>
    <main id="settings-page" class="page" role="tabpanel" aria-labelledby="settings-tab" hidden>
      <div id="settings"></div>
    </main>
    <div id="hover" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
